<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Shop</title>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
		/>
		<link rel="stylesheet" href="./Assets/Css/style.css" />
	</head>
	<body>
		<div class="container">
			<div class="box mt-6 grid">
				<form onsubmit="return submitHandler()">
					<div class="columns">
						<div class="column is-8">
							<div class="field">
								<label class="label" for="product_title">Product title</label>
								<div class="control">
									<input class="input" type="text" id="product_title" placeholder="Product title" />
								</div>
							</div>
						</div>
						<div class="column is-2">
							<div class="field">
								<label class="label" for="product_price">Price</label>
								<div class="control">
									<input class="input" type="number" id="product_price" placeholder="0.00" />
								</div>
							</div>
						</div>
						<div class="column is-1">
							<div class="field">
								<label class="label" for="product_qty">Qty</label>
								<div class="control">
									<input class="input" type="number" id="product_qty" min="1" max="100" value="1" />
								</div>
							</div>
						</div>
						<div class="column is-1 is-align-self-flex-end">
							<button class="button is-primary" type="submit">Add</button>
						</div>
					</div>
				</form>
			</div>
			<div class="box mt-4">
				<h2 class="title is-3">Product in cart</h2>
				<table class="table is-fullwidth">
					<thead>
						<tr>
							<th>#</th>
							<th>Title</th>
							<th>Is buy</th>
							<th>Price</th>
							<th>Qty</th>
							<th>Total</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tfoot>
						<tr>
							<th colspan="4"></th>
							<th>Total</th>
							<th id="cart_total"></th>
						</tr>
					</tfoot>
					<tbody id="products_list">

					</tbody>
				</table>
			</div>
		</div>
		<script src="./Assets/Scripts/myToast.js"></script>
		<script src="./Assets/Scripts/script.js"></script>
	</body>
</html>
